<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Emerald to Vibrant Green Gradient -->
    <linearGradient id="daoGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <!-- Subtle White Overlay -->
    <linearGradient id="whiteShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Base Container: Smooth Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#daoGreenGrad)" />
  <rect x="24" y="24" width="464" height="232" rx="120" fill="url(#whiteShine)" />

  <!-- Pure White Brand Symbol (Graduation Cap & Open Book) -->
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Graduation Cap Top -->
    <path d="M256 128 L384 184 L256 240 L128 184 Z" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M352 208 v56 c0 18 -44 32 -96 32 s-96 -14 -96 -32 v-56" />

    <!-- Open Book Pages -->
    <path d="M136 296 c40 -20 80 -20 120 0 c40 -20 80 -20 120 0 v104 c-40 -20 -80 -20 -120 0 c-40 -20 -80 -20 -120 0 Z" fill="#ffffff" />
    <!-- Book Center Divider -->
    <path d="M256 296 v104" stroke="#059669" stroke-width="18" />
  </g>
</svg>